[package]
name = "dtview"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
actix-ws = "0.3.1"
clap = { version = "4.5.58", features = ["derive"] }
notify = "8.2.0"
dtparse = { path = "../dtparse", features = ["serde", "multithread"] }
anyhow = "1.0.101"
tokio = { version = "1.49.0", features = ["sync", "rt", "rt-multi-thread", "macros"] }
serde_json = "1.0.149"
indexmap = { version = "2.13.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
